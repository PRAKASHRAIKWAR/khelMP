{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhelMP | Choose a new password</title>
    <link rel="stylesheet" href="{% static 'portal/site.css' %}">
</head>
<body>
    <main class="login-layout">
        <section class="login-main">
            <div class="login-panel">
                <span class="account-kicker">Account recovery</span>
                {% if validlink %}
                    <h1>Choose a new password</h1>
                    <form class="login-form" method="post">
                        {% csrf_token %}
                        <div class="field">
                            <label for="id_new_password1">New password</label>
                            <input class="control" id="id_new_password1" name="new_password1" type="password" autocomplete="new-password" required>
                        </div>
                        <div class="field">
                            <label for="id_new_password2">Confirm new password</label>
                            <input class="control" id="id_new_password2" name="new_password2" type="password" autocomplete="new-password" required>
                        </div>
                        {% if form.errors %}<div class="notice notice-error" role="alert">{{ form.errors }}</div>{% endif %}
                        <button class="button button-warm" type="submit">Update password</button>
                    </form>
                {% else %}
                    <h1>This reset link has expired</h1>
                    <p>Request a new link to reset your password.</p>
                    <a class="button button-warm" href="{% url 'password-reset' %}">Request another link</a>
                {% endif %}
            </div>
        </section>
    </main>
</body>
</html>
