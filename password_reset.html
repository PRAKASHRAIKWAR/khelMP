{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KhelMP | Reset password</title>
    <link rel="stylesheet" href="{% static 'portal/site.css' %}">
</head>
<body>
    <main class="login-layout">
        <section class="login-main">
            <div class="login-panel">
                <span class="account-kicker">Account recovery</span>
                <h1>Reset your password</h1>
                <p>Enter the email address on your account. If it is registered, we will send a secure reset link.</p>
                <form class="login-form" method="post">
                    {% csrf_token %}
                    <div class="field">
                        <label for="id_email">Email</label>
                        <input class="control" id="id_email" name="email" type="email" autocomplete="email" required autofocus>
                    </div>
                    <button class="button button-warm" type="submit">Send reset link</button>
                </form>
                <p class="account-switch"><a href="{% url 'login' %}">Back to sign in</a></p>
            </div>
        </section>
    </main>
</body>
</html>
