services:
  - type: web
    name: khelmp-frontend
    runtime: python
    plan: free
    region: singapore
    rootDir: khelmp_master_ecosystem/khelmp_frontend_django
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate --noinput
    startCommand: gunicorn khelmp_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: khelmp-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: khelmp-frontend.onrender.com
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

databases:
  - name: khelmp-db
    databaseName: khelmp
    user: khelmp
    plan: free
    region: singapore
    postgresMajorVersion: "16"
